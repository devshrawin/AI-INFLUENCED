{% extends "base.html" %}
{% block content %}
<article class="narrow">
  <h2>Change password</h2>
  {% if user.must_change_password %}<p class="error-text">You must set a new password before continuing.</p>{% endif %}
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  {% if ok %}<p class="ok-text">{{ ok }}</p>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password (10+ characters, not only letters) <input type="password" name="new" autocomplete="new-password" required minlength="10"></label>
    <label>Repeat new password <input type="password" name="confirm" autocomplete="new-password" required minlength="10"></label>
    <button type="submit">Change password</button>
  </form>
</article>
{% endblock %}
