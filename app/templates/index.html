{% extends "base.html" %}
{% block content %}
<article>
  <h2>Check an uploaded file</h2>
  <p>Flags files whose metadata shows AI involvement, and images already uploaded by another applicant.
     The scheme platform normally does this automatically through the API. Use this page for manual checks.</p>
  <form hx-post="/check" hx-target="#result" hx-encoding="multipart/form-data"
        hx-indicator="#busy" hx-disabled-elt="button">
    <div class="grid">
      <label>Application number <input name="application_id" required maxlength="100" placeholder="e.g. KL-SCH-2026-00412"></label>
      <label>Applicant ID <input name="applicant_id" required maxlength="100" placeholder="e.g. citizen / Aadhaar-masked ID"></label>
    </div>
    <div class="grid">
      <label>Scheme (optional) <input name="scheme" maxlength="100" placeholder="e.g. Flood relief 2026"></label>
      <label>This file is a
        <select name="doc_type">
          <option value="auto">Detect automatically</option>
          <option value="photo">Photo (damage, house, crop…)</option>
          <option value="document">Document (marksheet, certificate…)</option>
        </select>
      </label>
    </div>
    <label>File (PDF, DOCX, JPG, PNG, WEBP; max {{ settings.max_upload_mb }} MB)
      <input type="file" name="file" required accept=".pdf,.docx,.jpg,.jpeg,.png,.webp"></label>
    <button type="submit">Check</button>
    <progress id="busy" class="htmx-indicator"></progress>
  </form>
</article>
<div id="result"></div>
{% endblock %}
