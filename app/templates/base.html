<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Upload Integrity Check{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/poc.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="logo">&#9678;</div>
      <div>
        <h1>Upload Integrity Check</h1>

</html>
