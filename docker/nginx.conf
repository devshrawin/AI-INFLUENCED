# HTTPS reverse proxy in front of the app.
# Put the department's certificate in docker/certs/server.crt and server.key
# (scripts/install_sdc.sh creates a self-signed one if none is present).

limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    # If HTTPS_PORT in .env is not 443, add it here, e.g. https://$host:8443$request_uri
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    client_max_body_size 30m;          # keep >= MAX_UPLOAD_MB in .env
    proxy_read_timeout 300s;           # long documents take time on CPU

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
