# Upload Integrity Check - production stack for the State Data Centre.
#
#   docker compose up -d                      # app + database + nginx
#   docker compose --profile clamav up -d     # ... plus ClamAV virus scanner
#
# The "backend" network is internal: containers on it have NO route to the
# internet. Only nginx is reachable from the office network.

name: aci

services:
  app:
    image: aci-app:${ACI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aci:${POSTGRES_PASSWORD}@db:5432/aci
      CLAMAV_SOCKET: /run/clamav/clamd.sock
    volumes:
      - app-data:/data
      - clamav-socket:/run/clamav
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2g}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aci
      POSTGRES_USER: aci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aci -d aci"]
      interval: 10s
      retries: 10
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [backend, frontend]

  clamav:
    image: clamav/clamav:1.4
    profiles: ["clamav"]
    restart: unless-stopped
    environment:
      # No internet: signature updates are copied in by hand (see docs).
      CLAMAV_NO_FRESHCLAMD: "true"
    volumes:
      - ./clamav-db:/var/lib/clamav
      - clamav-socket:/tmp
    networks: [backend]

volumes:
  app-data:
  db-data:
  clamav-socket:

networks:
  backend:
    internal: true
  frontend:
